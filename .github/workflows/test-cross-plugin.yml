name: Cross-Plugin Guards
# Runs repo-root behavior guards that span more than one plugin, so they can't
# live in any single plugin's release-blocking suite. Scoped tightly to the
# files each guard covers — a core-only or single-plugin PR must not trigger it.
# NOTE: the automode-env glob matches the three copies under scripts/ today;
# a future copy placed elsewhere would need its path added here.
# The hatch/hermit-meta/core-scripts globs cover the domain-hatch contract: a
# hatch rewrite, a changed core floor declaration, and the shared script itself
# all have to re-run that guard, and none of them would trigger any single
# plugin's own workflow. The CLAUDE-APPEND and plugin.json globs exist for the
# same reason: the contract asserts the template's marker pair and the
# version-triple agreement, so edits to either must re-run it. Core's own
# plugin.json (bumped on every release) and CLAUDE-APPEND are negated: the
# contract never reads core's manifest or template, so those edits can't
# change its outcome.
# The hooks/** glob plus the three dev guard scripts cover the hook stdin
# contract: every fleet hook keeps its own sealed stdin copy, so a drifted drain
# or fail direction is only caught by re-running that corpus here.
on:
  push:
    branches: [main]
    paths:
      - 'plugins/*/scripts/automode-env.ts'
      - 'plugins/*/skills/hatch/**'
      - 'plugins/*/.claude-plugin/hermit-meta.json'
      - 'plugins/*/.claude-plugin/plugin.json'
      - '!plugins/claude-code-hermit/.claude-plugin/plugin.json'
      - 'plugins/*/state-templates/CLAUDE-APPEND.md'
      - '!plugins/claude-code-hermit/state-templates/CLAUDE-APPEND.md'
      - 'plugins/claude-code-hermit/scripts/**'
      - 'plugins/*/hooks/**'
      - 'plugins/claude-code-dev-hermit/scripts/git-push-guard.ts'
      - 'plugins/claude-code-dev-hermit/scripts/worktree-boundary-guard.ts'
      - 'plugins/claude-code-dev-hermit/scripts/record-test-result.ts'
      - 'tests/cross-plugin/**'
      - 'tests/lib/**'
      - 'scripts/test-all.sh'
      - '.github/workflows/test-cross-plugin.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
  pull_request:
    paths:
      - 'plugins/*/scripts/automode-env.ts'
      - 'plugins/*/skills/hatch/**'
      - 'plugins/*/.claude-plugin/hermit-meta.json'
      - 'plugins/*/.claude-plugin/plugin.json'
      - '!plugins/claude-code-hermit/.claude-plugin/plugin.json'
      - 'plugins/*/state-templates/CLAUDE-APPEND.md'
      - '!plugins/claude-code-hermit/state-templates/CLAUDE-APPEND.md'
      - 'plugins/claude-code-hermit/scripts/**'
      - 'plugins/*/hooks/**'
      - 'plugins/claude-code-dev-hermit/scripts/git-push-guard.ts'
      - 'plugins/claude-code-dev-hermit/scripts/worktree-boundary-guard.ts'
      - 'plugins/claude-code-dev-hermit/scripts/record-test-result.ts'
      - 'tests/cross-plugin/**'
      - 'tests/lib/**'
      - 'scripts/test-all.sh'
      - '.github/workflows/test-cross-plugin.yml'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'

jobs:
  cross-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun test tests/cross-plugin/ tests/lib/
